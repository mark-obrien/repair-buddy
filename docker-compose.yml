services:
  app:
    build:
      context: .
      target: deps
    ports:
      - "6788:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_GENERATIVE_AI_API_KEY=${GOOGLE_GENERATIVE_AI_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - MYSQL_URL=mysql://repair:repair@mysql:3306/repair_buddy
      - FFMPEG_PATH=/usr/bin/ffmpeg
    command: npm run dev
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: repair_buddy
      MYSQL_USER: repair
      MYSQL_PASSWORD: repair
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-urepair", "-prepair"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
